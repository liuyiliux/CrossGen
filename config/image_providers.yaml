content_safety:
  action: block
  enabled: true
  filters:
  - violence
  - adult_content
  - hate_speech
  - illegal_content
performance:
  cache:
    enabled: true
    max_size: 500
    storage_type: memory
    ttl: 86400
  concurrent_requests:
    max_concurrent: 3
    queue_size: 10
    timeout_per_request: 120
  warmup:
    common_prompts:
    - beautiful landscape
    - modern interior design
    - fashion photography
    enabled: false
platform_mapping:
  douyin:
    aspect_ratio: '9:16'
    fallback_provider: stable_diffusion
    primary_provider: dall_e
  toutiao:
    aspect_ratio: '1:1'
    fallback_provider: stable_diffusion
    primary_provider: dall_e
  wechat:
    aspect_ratio: '16:9'
    fallback_provider: stable_diffusion
    primary_provider: dall_e
  xiaohongshu:
    aspect_ratio: '2:3'
    fallback_provider: stable_diffusion
    primary_provider: dall_e
post_processing:
  basic_adjustments:
    brightness: 0
    contrast: 0
    saturation: 0
    sharpness: 0
  resizing:
    downscale_method: area
    maintain_aspect_ratio: true
    upscale_method: lanczos
  watermark:
    color: '#FFFFFF'
    enabled: false
    font_size: 24
    opacity: 0.5
    position: bottom_right
    text: 逸流生成
prompt_enhancement:
  douyin:
    composition_keywords:
    - close-up
    - eye-level
    - engaging
    lighting_keywords:
    - dramatic lighting
    - vibrant colors
    quality_keywords:
    - 4k
    - ultra detailed
    - cinematic
    style_keywords:
    - dynamic
    - energetic
    - bold
    - attention-grabbing
  toutiao:
    composition_keywords:
    - news photography
    - storytelling
    lighting_keywords:
    - natural
    - available light
    quality_keywords:
    - realistic
    - detailed
    - clear
    style_keywords:
    - news-style
    - documentary
    - authentic
    - journalistic
  wechat:
    composition_keywords:
    - wide shot
    - informative layout
    lighting_keywords:
    - even lighting
    - professional
    quality_keywords:
    - high resolution
    - crisp
    - well-composed
    style_keywords:
    - professional
    - clean
    - informative
    - editorial
  xiaohongshu:
    composition_keywords:
    - centered
    - balanced
    - rule of thirds
    lighting_keywords:
    - soft lighting
    - natural light
    - bright
    quality_keywords:
    - high quality
    - detailed
    - sharp focus
    - professional
    style_keywords:
    - ins
    - trending
    - aesthetic
    - vibrant
    - lifestyle
providers:
  gemini:
    api_key: ${GEMINI_API_KEY}
    base_url: https://generativelanguage.googleapis.com/v1
    enabled: false
    headers:
      Authorization: Bearer ${GEMINI_API_KEY}
      Content-Type: application/json
    image_model: gemini-1.5-flash
    model: gemini-1.5-flash
    name: gemini
    reference_image_field: images
    retry_count: 2
    size_config:
      douyin:
      - 1024x1792
      toutiao:
      - 1024x1024
      wechat:
      - 1792x1024
      xiaohongshu:
      - 1024x1792
      - 1792x1024
    status: disconnected
    support_multiple_reference_images: true
    support_reference_image: true
    supported_sizes: []
    timeout: 60
    type: gemini
  openai:
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
    enabled: false
    headers:
      Authorization: Bearer ${OPENAI_API_KEY}
      Content-Type: application/json
    image_model: dall-e-3
    image_quality: standard
    image_style: vivid
    model: gpt-4o
    name: openai
    reference_image_field: image_urls
    retry_count: 2
    size_config:
      douyin:
      - 1024x1792
      toutiao:
      - 1024x1024
      wechat:
      - 1792x1024
      xiaohongshu:
      - 1024x1792
      - 1792x1024
    status: disconnected
    support_multiple_reference_images: true
    support_reference_image: true
    supported_sizes: []
    timeout: 60
    type: openai
  siliconflow-Kolors:
    api_key: sk-llcbjvooquigqisjmxrrubpfsfjnmujdahiozggweigrcbtd
