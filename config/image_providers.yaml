  siliconflow-Qwen-Image:
    api_key: sk-llcbjvooquigqisjmxrrubpfsfjnmujdahiozggweigrcbtd
    base_url: https://api.siliconflow.cn/v1/images/generations
    enabled: true
    headers:
      Authorization: Bearer ${SILICONFLOW_API_KEY}
      Content-Type: application/json
    image_jsonpath: $.images[*].url
