quality_control:
  auto_retry:
    enabled: true
    max_retries: 2
    retry_conditions:
    - low_quality_score
    - content_filter_triggered
    - generation_error
  quality_check:
    allowed_formats:
    - png
    - jpg
    - jpeg
    - webp
    enabled: true
    max_file_size: 10485760
    min_resolution: 512
  quality_thresholds:
    aesthetic_threshold: 0.6
    min_score: 0.7
    technical_threshold: 0.8
