    model: Kwai-Kolors/Kolors
    name: siliconflow-Kolors
    reference_image_field: init_images
    retry_count: 2
    return_format: url
    size_config:
      douyin:
      - 1024x1792
      toutiao:
      - 1024x1024
      wechat:
      - 1792x1024
      xiaohongshu:
      - 1024x1792
      - 1792x1024
    status: connected
    support_multiple_reference_images: false
    support_reference_image: true
    supported_sizes:
    - 1024x1024
    - 960x1280
    - 768x1024
    - 720x1440
    - 720x1280
    timeout: 120
